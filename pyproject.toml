[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lieme"
version = "0.3.0"
description = "Li-ion Intercalation Electrode Materials Exploration"
readme = "README.md"
authors = [
    { name = "Sree Harsha Bhimineni", email = "bsreeharsha@g.ucla.edu" }
]
license = { text = "MIT" }
requires-python = ">=3.11.0"
dependencies = [
    "tpot>=0.12.2",
    "scikit-learn>=1.5.2",
    "shap>=0.48.0",
    "ase>=3.23.0",
    "pymatgen>=2025.1.9",
    "matminer>=0.10.0",
    "mp-api>=0.45.3",
    "jarvis-tools>=2025.5.30",
    "qmpy-rester>=0.2.0",
    "gg @ git+https://github.com/kkjsawantucla/gg.git@main",
    "openpyxl"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[project.urls]
Homepage = "https://github.com/sreeharshab/lieme"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]